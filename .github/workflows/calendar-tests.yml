name: Calendar MCP tests

permissions:
  contents: read

on:
  push:
    paths:
      - 'extensions/kaze-calendar/**'
      - '.github/workflows/calendar-tests.yml'
  pull_request:
    paths:
      - 'extensions/kaze-calendar/**'
      - '.github/workflows/calendar-tests.yml'

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extensions/kaze-calendar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: extensions/kaze-calendar/pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check src tests scripts run_mcp.py
      - run: python -m pytest -q
