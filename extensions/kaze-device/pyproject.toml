[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kaze-device"
version = "0.1.0"
description = "Windows session and power context MCP service for Kaze"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
kaze-device = "kaze_device.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
